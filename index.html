<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Spiloversigt | Spilcafé</title>

    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="images/favicon.ico" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="header-content">
        <a href="#" class="logo" aria-label="Gå til toppen af siden">
          <img src="images/spilcafe.logo.webp" alt="Spilcafé" />
        </a>

        <button type="button" class="book-button" id="open-booking">
          Book bord
        </button>
      </div>
    </header>

    <main>
      <!-- Intro -->
      <section class="intro">
        <h1>Find et spil. Hyg dig.</h1>

        <p>
          Find et brætspil, der passer til jer, og gør jer klar til en hyggelig
          stund i Spilcaféen.
        </p>
      </section>

      <!-- Spiloversigt -->
      <section class="games-section" aria-labelledby="games-heading">
        <h2 id="games-heading">Spiloversigt</h2>

        <!-- Søgning, kategori og sortering -->
        <div class="filterbar">
          <div class="filter-row-main">

            <div class="filter-group search-group">
              <label for="search-input">Søg efter spil</label>
              <input
                type="search"
                id="search-input"
                placeholder="Søg efter et spil..."
              />
            </div>

            <div class="filter-group">
              <label for="genre-select">Kategori</label>
              <select id="genre-select">
                <option value="all">Alle kategorier</option>
                <!-- Kategorier indsættes dynamisk via JavaScript -->
              </select>
            </div>

            <div class="filter-group">
              <label for="sort-select">Sortering</label>
              <select id="sort-select">
                <option value="none">Ingen sortering</option>
                <option value="title-asc">Titel (A–Å)</option>
                <option value="title-desc">Titel (Å–A)</option>
              </select>
            </div>

          </div>
        </div>

       <!-- Status for søgeresultater til skærmlæsere -->
       <p
       id="results-status"
       class="visually-hidden"
       aria-live="polite"
       ></p>

       <!-- Spil indsættes dynamisk via JavaScript -->
       <div id="game-list" class="game-grid"></div>>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-content">

        <div class="footer-brand">
          <p>Brætspil, hygge og gode stunder.</p>
        </div>

        <div class="footer-info">
          <h2>Spilcaféen</h2>
          <p>Find dit næste spil og book et bord til en hyggelig stund.</p>
        </div>

        <div class="footer-action">
          <button type="button" class="book-button" id="footer-booking">
            Book bord
          </button>
        </div>

      </div>
    </footer>

    <!-- Dialog til booking af bord -->
    <dialog
      id="booking-dialog"
      aria-labelledby="booking-heading"
      aria-describedby="booking-description"
    >
      <div class="booking-dialog-content">

        <button
          type="button"
          id="close-booking"
          class="close-booking"
          aria-label="Luk booking"
        >
          ✕
        </button>

        <h2 id="booking-heading">Book et bord</h2>

        <p id="booking-description">
          Vælg dato, tidspunkt og antal personer.
        </p>

        <form id="booking-form">
          <div class="booking-field">
            <label for="booking-name">Navn</label>
            <input
              type="text"
              id="booking-name"
              name="name"
              autocomplete="name"
              required
            />
          </div>

          <div class="booking-field">
            <label for="booking-date">Dato</label>
            <input
              type="date"
              id="booking-date"
              name="date"
              required
            />
          </div>

          <div class="booking-field">
            <label for="booking-time">Tidspunkt</label>
            <input
              type="time"
              id="booking-time"
              name="time"
              required
            />
          </div>

          <div class="booking-field">
            <label for="booking-guests">Antal personer</label>
            <input
              type="number"
              id="booking-guests"
              name="guests"
              min="1"
              required
            />
          </div>

          <button type="submit" class="booking-submit">
            Book bord
          </button>
        </form>

      </div>
    </dialog>

    <!-- Dialog med spildetaljer -->
    <dialog id="game-dialog" aria-labelledby="game-dialog-heading">
      <form method="dialog">
        <button
          type="submit"
          id="close-dialog"
          aria-label="Luk spildetaljer"
        >
          ✕
        </button>

        <div id="dialog-content">
          <!-- Spildetaljer indsættes dynamisk via JavaScript -->
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
