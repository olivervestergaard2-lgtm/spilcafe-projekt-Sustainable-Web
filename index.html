<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spil oversigt</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="images/favicon.ico" />
    <!--luckiest guy og poppins font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet">
  </head>

<body>
  <header>
    <div class="header-content">
      <a href="#" class="logo">Spilcafé</a>
      <a href="#booking" class="book-button">Book bord</a>
    </div>
  </header>

   <main>
  <section class="intro">
    <h1>Find dit næste brætspil</h1>
    <p>Søg, filtrer og udforsk vores spiludvalg.</p>
  </section>

  <section class="games-section">
    <h2>Spiloversigt</h2>

    <!-- Filter bar med alle filtreringsmuligheder -->
      <section class="filterbar">
        <!-- Øverste række: Søg og genre -->
        <div class="filter-row-main">
          <div class="filter-group search-group">
            <label for="search-input"> Søg</label>
            <input type="text" id="search-input" placeholder="Søg efter et spil..." />
          </div>

          <div class="filter-group">
            <label for="genre-select"> Kategori</label>
            <select id="genre-select">
              <option value="all">Alle kategorier</option>
              <!-- Kategorier indsættes dynamisk via JavaScript -->
            </select>
          </div>

          <div class="filter-group">
            <label for="sort-select"> Sortering</label>
            <select id="sort-select">
              <option value="none">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
            </select>
          </div>
        </div>

          <!-- Ryd alle filtre knap -->
          <button id="clear-filters" class="clear-btn">
            <span class="btn-icon">🗑️</span>
            <span class="btn-text">Nulstil filtre</span>
          </button>
      </section>

      <!-- spil grid -->
      <section id="game-list" class="game-grid">
  <!-- spil vil blive indsat her dynamisk -->
</section>

</section>
</main>

    <!-- Footer -->
    <footer>
      <p>© RACE - Rasmus Cederdorff</p>
    </footer>

    <!-- Dialog med spildetaljer -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Luk">✕</button>
        <div id="dialog-content">
          <!-- Spildetaljer indsættes dynamisk via JavaScript -->
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
